# Self-hosted ntfy for lumen-watchdog alerts (docs/ntfy.md).
# Listens on 127.0.0.1:2586 only; the web server in front terminates TLS (apache-ntfy.conf).
# Image pinned by digest (multi-arch index of v2.38.2, read from Docker Hub on 2026-11-27).
name: ntfy

services:
  ntfy:
    image: binwiederhier/ntfy:v2.38.2@sha256:ca35419d29a834824db2440fa9320897fbe40b026c5fc2360c76ed3501b5e716
    command: serve
    restart: unless-stopped
    ports:
      - "127.0.0.1:2586:2586"
    volumes:
      - ./server.yml:/etc/ntfy/server.yml:ro
      - ./data:/var/lib/ntfy
    environment:
      TZ: Europe/Vienna
    mem_limit: 96m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O - http://localhost:2586/v1/health | grep -q '\"healthy\":true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
