# Reverse proxy for ntfy behind Apache 2.4.47+ (mod_proxy, mod_proxy_http).
# KeyHelp: paste the lines below into the domain's custom Apache directives (HTTPS vhost).
# Other setups: put them inside the <VirtualHost *:443> block of the ntfy host name.
ProxyPreserveHost On
ProxyPass / http://127.0.0.1:2586/ upgrade=websocket
ProxyPassReverse / http://127.0.0.1:2586/
SetEnv proxy-nokeepalive 1
SetEnv proxy-sendchunked 1
LimitRequestBody 102400
